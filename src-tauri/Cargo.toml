[workspace]
resolver = "2"
members = ["crates/*"]

# ---------------------------------------------------------------------------
# 工作区级共享元数据（各 crate 通过 `xxx.workspace = true` 继承）
# ---------------------------------------------------------------------------
[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
license = "MIT OR Apache-2.0"

# ---------------------------------------------------------------------------
# 工作区级依赖版本锁定（`02 §2.5` 依赖清单）
#
# 红线（C4）：禁止引入 GPL/LGPL 依赖。
# 红线（C9）：禁止引入 reqwest / hyper / tokio-tungstenite 等任何网络能力。
#
# 注意：Tauri 2 默认特性已满足透明窗口所需；**不开 devtools**（`02 §1.4`）。
# 其余依赖（serde / image / rodio / chrono ...）随各模块落地时按需增补，
# 不在骨架阶段预先引入（避免无谓编译耗时）。
#
# S1-M2（T-02 段上）新增：
#   - `thiserror`：内核错误枚举（`02 §7.4`，MIT OR Apache-2.0）；
#   - `windows`：Win32 调用（`02 §2.5`，MIT OR Apache-2.0），仅取窗口层所需最小 feature。
# S1-M5（T-03 配置中心与资源加载）新增：
#   - `serde` / `serde_json`：外置配置与 atlas.json 反序列化（MIT OR Apache-2.0）；
#   - `tracing`：库内日志（`02 §7.5`，MIT OR Apache-2.0）；
#   - `image`：PNG 解码（仅取 png feature，MIT OR Apache-2.0）；
#   - `lru`：`LruAtlasCache` 字节驱逐底层（MIT）；
#   - `schemars`：配置 JSON Schema 生成（`02 §4.2` / §7.7-5，MIT OR Apache-2.0）；
#     经 dp-core 的 `schema` feature 门控保持 dev-only，默认构建不参与编译。
# S2-M7（T-07 感知服务）新增：
#   - `crossbeam-channel`：perception → core 有界队列 `bounded(64)`（`02 §1.4`，MIT OR Apache-2.0）；
#   - `chrono`：`WallClock` 端口 `now_local` / 时区偏移（`02 §4.4` / §5.14，MIT OR Apache-2.0）；
#   - windows feature 扩充（最小必需集）：`Win32_System_Power`（GetSystemPowerStatus 电量）、
#     `Win32_System_Threading`（GetSystemTimes CPU 负载差分；注意该 API 位于 Threading
#     而非 SystemInformation）、`Win32_UI_Input_KeyboardAndMouse`
#     （GetLastInputInfo 在场空闲）。
# S4-M6（T-13 段 · 下 / FR-7-3 音量 / FR-7-4 勿扰）新增：
#   - `rodio`：音效播放（`02 §2.5` 已登记行，MIT OR Apache-2.0）。**默认特性关闭**，
#     仅取原生 `vorbis`（lewton，OGG Vorbis 容器+编码解码，MIT）+ `wav`（hound，WAV 兜底）。
#     注：rodio 0.19 的 `symphonia-vorbis` 仅开 Vorbis 编码、未暴露 `symphonia/ogg` 容器开关，
#     对 OGG 文件实测报 `Unrecognized format`，故改用原生 vorbis 解码器（`02 §7.7-4` 音效格式）。
#     不拖入 flac/mp3 解码器（`02 §2.5` 最小必需集口径）。
#     **C9 零网络口径**：rodio → cpal（Windows 走 `windows` crate / WASAPI）+ symphonia，
#     全为纯本地解码与音频设备访问，`cargo tree` 无 `reqwest` / `hyper` /
#     `tokio-tungstenite`，运行期零外连；capabilities 与 CSP 不变。
# S4-M1（T-11 段 · 上 / FR-1-10 / F10 会话暂停）新增：
#   - `Win32_System_RemoteDesktop`：`WTSQuerySessionInformationW` / `WTSFreeMemory`
#     （锁屏 / 远程桌面会话状态轮询）。**C9 零网络口径**：仅调用本机 `wtsapi32.dll`，
#     不产生任何外连，capabilities / CSP 不变。真机受限时按 P1-2 降级 idle 近似
#     并登记偏离（见 `dp-platform/src/win/session.rs` 模块文档）。
# S5-M4（T-15 段 · 中 / FR-1-9 开机自启 + FR-1-10 退出确认 + K-7 存档原生提示）新增：
#   - `Win32_System_Registry` + `Win32_Security`：`RegCreateKeyExW` / `RegSetValueExW` /
#     `RegDeleteValueW` / `RegQueryValueExW` / `RegOpenKeyExW`（HKCU `...\CurrentVersion\Run`
#     自启项读写）。注：`RegCreateKeyExW` 在 `windows 0.61` 中由 `Win32_Security`
#     feature 门控（其签名含 `SECURITY_ATTRIBUTES`），故一并启用。
#     **C9 零网络口径**：仅操作本机 HKCU 注册表，不触网、不引入任何网络 API；
#     capabilities / CSP / tauri.conf.json 均不变。
#   - `MessageBoxW`（`Win32_UI_WindowsAndMessaging`，**已在既有 feature 面内**）：
#     退出确认与存档异常提示的原生对话框；零新增 feature、零新增依赖。
#   - `tauri-plugin-single-instance`：单实例锁（R17；二次启动唤醒已运行实例）。
#     **C9 零网络口径**：插件仅用本机命名互斥体 / 窗口消息实现进程互斥与唤醒，
#     无任何网络面（`cargo tree` 无 reqwest/hyper/tokio-tungstenite 新增分支）。
# ---------------------------------------------------------------------------
[workspace.dependencies]
tauri = { version = "2" }
tauri-build = { version = "2" }
thiserror = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
tracing = { version = "0.1" }
image = { version = "0.25", default-features = false, features = ["png"] }
lru = { version = "0.12" }
schemars = { version = "0.8" }
crossbeam-channel = { version = "0.5" }
chrono = { version = "0.4" }
# S5-M4：单实例守护（`02 §2.5` 已登记行；R17 多开存档竞争防护的①）。
# 默认特性（不启用 `deep-link`：本项目无 URL scheme 需求，最小必需集口径）。
tauri-plugin-single-instance = { version = "2" }
rodio = { version = "0.19", default-features = false, features = [
    "vorbis",
    "wav",
] }

# Win32 句柄 / 窗口 / 显示器 / DPI / DWM / Shell（ITaskbarList）。
# feature 为「最小必需集」，避免拖入超重模块拖慢编译。
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_UI_HiDpi",
    "Win32_System_Power",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_RemoteDesktop",
    "Win32_System_Registry",
    "Win32_Security",
] }
