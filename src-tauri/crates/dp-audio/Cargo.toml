[package]
name = "dp-audio"
description = "音频：解码与播放总线（OGG，队列上限 8，溢出丢弃）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
name = "dp_audio"
path = "src/lib.rs"

# S4-M6（T-13 段 · 下）落地：
#   - `rodio`：唯一新增外部依赖（`02 §2.5` 已登记行，MIT OR Apache-2.0）。
#     工作区默认特性关闭、只取 `symphonia-vorbis` + `symphonia-wav`（见根 Cargo.toml 注记）。
#   - `thiserror`：类型化错误（`02 §7.4`）。
# 本 crate **不依赖 dp-core**（音频无时间概念，事件驱动即可；避免与内核形成环）。
[dependencies]
rodio = { workspace = true }
thiserror = { workspace = true }
